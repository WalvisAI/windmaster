<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 610" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="34%" r="80%">
      <stop offset="0%" stop-color="#16241a"/><stop offset="100%" stop-color="#0a120a"/>
    </radialGradient>
    <radialGradient id="ocular" cx="50%" cy="50%" r="52%">
      <stop offset="0%" stop-color="#20301f"/><stop offset="62%" stop-color="#162215"/>
      <stop offset="86%" stop-color="#0c140c"/><stop offset="100%" stop-color="#050905" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d8b3d"/><stop offset="100%" stop-color="#265a26"/>
    </linearGradient>
  </defs>
  <rect width="300" height="610" fill="url(#bg)"/>

  <!-- status bar -->
  <text x="18" y="34" fill="#8a9c8a" font-size="12" font-weight="600">9:41</text>
  <g fill="#8a9c8a"><circle cx="258" cy="30" r="2"/><circle cx="266" cy="30" r="2"/><circle cx="274" cy="30" r="2"/><rect x="280" y="25" width="4" height="9" rx="1"/></g>

  <!-- HUD chips -->
  <g font-size="11" font-weight="700">
    <rect x="16" y="52" width="80" height="40" rx="9" fill="#151b15" stroke="#2a3a2a"/>
    <text x="26" y="70" fill="#647263" font-size="9">RANGE</text><text x="26" y="85" fill="#eeeeaa" font-size="15" font-weight="800">42<tspan font-size="9" fill="#8a9c8a"> m</tspan></text>
    <rect x="110" y="52" width="80" height="40" rx="9" fill="#151b15" stroke="#2a3a2a"/>
    <text x="120" y="70" fill="#647263" font-size="9">WIND</text><text x="120" y="85" fill="#ffd464" font-size="15" font-weight="800">12<tspan font-size="9" fill="#8a9c8a"> km/h</tspan></text>
    <rect x="204" y="52" width="80" height="40" rx="9" fill="#151b15" stroke="#2a3a2a"/>
    <text x="214" y="70" fill="#647263" font-size="9">ZOOM</text><text x="214" y="85" fill="#d4e2d4" font-size="15" font-weight="800">24<tspan font-size="9" fill="#8a9c8a">×</tspan></text>
  </g>

  <!-- wind direction indicator -->
  <g transform="translate(150,118)">
    <circle r="17" fill="#101710" stroke="#2a3a2a"/>
    <path d="M0,-11 L6,4 L0,0 L-6,4 Z" fill="#ff4422" transform="rotate(115)"/>
    <text x="0" y="30" fill="#647263" font-size="8" text-anchor="middle" font-weight="700">WIND FROM 4 o'clock</text>
  </g>

  <!-- scope ocular -->
  <g transform="translate(150,340)">
    <circle r="132" fill="#05090a"/>
    <circle r="126" fill="url(#ocular)"/>
    <circle r="126" fill="none" stroke="#0a0f0a" stroke-width="8"/>
    <circle r="122" fill="none" stroke="#1c2a1c" stroke-width="1"/>
    <clipPath id="lens"><circle r="121"/></clipPath>
    <g clip-path="url(#lens)">
      <!-- ground -->
      <rect x="-130" y="46" width="260" height="120" fill="#13230f" opacity="0.8"/>
      <!-- knock-down target with kill zone, placed at holdover -->
      <g transform="translate(24,20)">
        <ellipse cx="0" cy="40" rx="34" ry="7" fill="#000" opacity="0.35"/>
        <path d="M-26,40 Q-30,-6 -6,-20 Q6,-30 18,-16 Q30,0 24,26 Q22,40 -26,40 Z" fill="#0e170e" stroke="#26361f" stroke-width="1.5"/>
        <circle cx="4" cy="2" r="11" fill="#101a10" stroke="#3a6a2a" stroke-width="2"/>
        <circle cx="4" cy="2" r="3.2" fill="#ffbb00"/>
      </g>
      <!-- reticle -->
      <g stroke="#c9d6c9" stroke-width="1.1" opacity="0.92">
        <line x1="-121" y1="0" x2="-14" y2="0"/><line x1="14" y1="0" x2="121" y2="0"/>
        <line x1="0" y1="-121" x2="0" y2="-14"/><line x1="0" y1="14" x2="0" y2="121"/>
        <g fill="#c9d6c9" stroke="none">
          <circle cx="-30" cy="0" r="1.6"/><circle cx="-60" cy="0" r="1.6"/><circle cx="-90" cy="0" r="1.6"/>
          <circle cx="30" cy="0" r="1.6"/><circle cx="60" cy="0" r="1.6"/><circle cx="90" cy="0" r="1.6"/>
          <circle cx="0" cy="30" r="1.6"/><circle cx="0" cy="60" r="1.6"/><circle cx="0" cy="90" r="1.6"/>
          <circle cx="0" cy="-30" r="1.6"/>
        </g>
        <!-- holdover marks (fine) -->
        <g stroke-width="0.8">
          <line x1="-6" y1="30" x2="6" y2="30"/><line x1="-5" y1="45" x2="5" y2="45"/>
          <line x1="-6" y1="60" x2="6" y2="60"/><line x1="-5" y1="75" x2="5" y2="75"/>
        </g>
      </g>
      <!-- aim point glow -->
      <circle cx="0" cy="0" r="2" fill="#ffd464"/>
      <!-- wind flag -->
      <g transform="translate(-92,-70)">
        <line x1="0" y1="0" x2="0" y2="46" stroke="#5a6b58" stroke-width="2"/>
        <path d="M0,2 Q22,6 30,14 Q20,16 0,16 Z" fill="#c44" opacity="0.9"/>
      </g>
    </g>
  </g>

  <!-- holdover hint -->
  <text x="150" y="492" text-anchor="middle" fill="#8a9c8a" font-size="11">Hold <tspan fill="#ffd464" font-weight="800">2.1 mil</tspan> up · <tspan fill="#ffd464" font-weight="800">0.6 mil</tspan> left</text>

  <!-- FIRE button -->
  <g transform="translate(150,548)">
    <rect x="-92" y="-26" width="184" height="52" rx="26" fill="url(#fire)" stroke="#4a9d4a" stroke-width="1"/>
    <text x="0" y="6" text-anchor="middle" fill="#eaffea" font-size="17" font-weight="800" letter-spacing="3">FIRE</text>
  </g>
</svg>
