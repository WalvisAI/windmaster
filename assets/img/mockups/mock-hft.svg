<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 610" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="hft-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a2a1f"/><stop offset="1" stop-color="#0e1a0e"/></linearGradient>
    <radialGradient id="hft-oc" cx="50%" cy="46%" r="55%"><stop offset="0" stop-color="#233520"/><stop offset="72%" stop-color="#162415" stop-opacity="0.25"/><stop offset="100%" stop-color="#0a120a" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="300" height="610" fill="url(#hft-sky)"/>
  <text x="18" y="38" fill="#ffd464" font-size="15" font-weight="800" letter-spacing="1">HFT</text>
  <text x="46" y="38" fill="#8a9c8a" font-size="11" font-weight="600">Hunter Field Target</text>

  <!-- stance + angle chips -->
  <g font-size="10" font-weight="700">
    <rect x="16" y="52" width="126" height="34" rx="9" fill="#151b15" stroke="#2a3a2a"/>
    <text x="30" y="73" fill="#8a9c8a" font-size="9">STANCE</text><text x="82" y="73" fill="#d4e2d4" font-size="12" font-weight="800">KNEELING</text>
    <rect x="158" y="52" width="126" height="34" rx="9" fill="#151b15" stroke="#2a3a2a"/>
    <text x="172" y="73" fill="#8a9c8a" font-size="9">ANGLE</text><text x="272" y="73" fill="#ffd464" font-size="12" font-weight="800" text-anchor="end">+25° uphill</text>
  </g>

  <!-- scope view -->
  <g transform="translate(150,300)">
    <circle r="126" fill="#070b07"/><circle r="122" fill="url(#hft-oc)"/>
    <circle r="122" fill="none" stroke="#0c140c" stroke-width="7"/>
    <clipPath id="hc"><circle r="119"/></clipPath>
    <g clip-path="url(#hc)">
      <!-- trees -->
      <g fill="#0e1c0d" opacity="0.85"><path d="M-120,80 l14,-40 l14,40 Z"/><path d="M-96,90 l18,-54 l18,54 Z"/><path d="M84,86 l16,-46 l16,46 Z"/></g>
      <rect x="-122" y="86" width="244" height="60" fill="#0f1c0c"/>
      <!-- elevated target on a post -->
      <g transform="translate(30,-34)">
        <rect x="-2" y="6" width="5" height="70" fill="#3a2a16"/>
        <path d="M-22,6 Q-26,-30 -4,-40 Q10,-46 20,-30 Q28,-12 20,10 Q16,20 -22,10 Z" fill="#0d160d" stroke="#2a3a24" stroke-width="1.5"/>
        <circle cx="0" cy="-14" r="9" fill="#0e170e" stroke="#3a6a2a" stroke-width="2"/><circle cx="0" cy="-14" r="2.6" fill="#ffbb00"/>
      </g>
      <!-- reticle -->
      <g stroke="#c9d6c9" stroke-width="1.1" opacity="0.9">
        <line x1="-119" y1="0" x2="-12" y2="0"/><line x1="12" y1="0" x2="119" y2="0"/>
        <line x1="0" y1="-119" x2="0" y2="-12"/><line x1="0" y1="12" x2="0" y2="119"/>
        <g fill="#c9d6c9" stroke="none"><circle cx="-30" cy="0" r="1.5"/><circle cx="-60" cy="0" r="1.5"/><circle cx="30" cy="0" r="1.5"/><circle cx="60" cy="0" r="1.5"/><circle cx="0" cy="-30" r="1.5"/><circle cx="0" cy="30" r="1.5"/><circle cx="0" cy="60" r="1.5"/></g>
      </g>
      <circle cx="0" cy="0" r="2" fill="#ffd464"/>
    </g>
  </g>

  <!-- angle dial -->
  <g transform="translate(52,300)">
    <circle r="30" fill="#101710" stroke="#2a3a2a"/>
    <path d="M0,0 L26,-12" stroke="#ffd464" stroke-width="2.5"/>
    <path d="M-24,0 A24,24 0 0 1 22,-11" fill="none" stroke="#3a4a30" stroke-width="2"/>
    <text x="0" y="20" text-anchor="middle" fill="#8a9c8a" font-size="8" font-weight="700">SLOPE</text>
  </g>

  <text x="150" y="470" text-anchor="middle" fill="#8a9c8a" font-size="11">Inclined shot · true drop &lt; flat-range drop</text>

  <!-- reduced kill-zone note -->
  <g transform="translate(18,494)">
    <rect x="0" y="0" width="264" height="34" rx="9" fill="#151b15" stroke="#3a5a2a"/>
    <circle cx="20" cy="17" r="7" fill="#101a10" stroke="#3a6a2a" stroke-width="1.6"/><circle cx="20" cy="17" r="2" fill="#ffbb00"/>
    <text x="38" y="21" fill="#c9d6c9" font-size="11">Reduced kill zone — <tspan fill="#ffd464" font-weight="800">15 mm</tspan></text>
  </g>
  <!-- raise button -->
  <g transform="translate(150,562)">
    <rect x="-92" y="-22" width="184" height="44" rx="22" fill="#2a5a2a" stroke="#4a9d4a"/>
    <text x="0" y="6" text-anchor="middle" fill="#ccffcc" font-size="15" font-weight="800" letter-spacing="2">RAISE</text>
  </g>
</svg>
