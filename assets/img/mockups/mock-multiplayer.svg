<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 610" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
  <rect width="300" height="610" fill="#0c120c"/>
  <text x="18" y="40" fill="#ffd464" font-size="15" font-weight="800" letter-spacing="1">MULTIPLAYER</text>
  <text x="18" y="58" fill="#8a9c8a" font-size="10.5">Same seeded course · live standings</text>

  <!-- invite code -->
  <g transform="translate(18,74)">
    <rect x="0" y="0" width="264" height="46" rx="11" fill="#151b15" stroke="#2a3a2a"/>
    <text x="14" y="20" fill="#647263" font-size="9" font-weight="700">INVITE CODE</text>
    <text x="14" y="38" fill="#eeeeaa" font-size="20" font-weight="800" letter-spacing="6">FT-7QK4</text>
    <text x="250" y="30" text-anchor="end" fill="#56a056" font-size="11" font-weight="700">● LIVE</text>
  </g>

  <text x="18" y="150" fill="#8a9c8a" font-size="10.5" font-weight="700" letter-spacing="1">LIVE STANDINGS</text>

  <!-- standings rows -->
  <g transform="translate(18,162)" font-size="12">
    <!-- row 1 leader -->
    <g><rect x="0" y="0" width="264" height="48" rx="11" fill="#233a1e" stroke="#3a6a2a"/>
      <text x="16" y="30" fill="#ffd464" font-size="16" font-weight="800">1</text>
      <circle cx="46" cy="24" r="12" fill="#2a5a2a"/><text x="46" y="28" text-anchor="middle" fill="#ccffcc" font-size="11" font-weight="800">JR</text>
      <text x="66" y="21" fill="#d4e2d4" font-weight="700">Javier R.</text><text x="66" y="36" fill="#8a9c8a" font-size="9">shot 12 / 15</text>
      <text x="248" y="30" text-anchor="end" fill="#eeeeaa" font-size="17" font-weight="800">112</text>
    </g>
    <g transform="translate(0,56)"><rect x="0" y="0" width="264" height="48" rx="11" fill="#151b15" stroke="#2a3a2a"/>
      <text x="16" y="30" fill="#8a9c8a" font-size="16" font-weight="800">2</text>
      <circle cx="46" cy="24" r="12" fill="#2a4a5a"/><text x="46" y="28" text-anchor="middle" fill="#cfe6ff" font-size="10" font-weight="800">YOU</text>
      <text x="66" y="21" fill="#d4e2d4" font-weight="700">You</text><text x="66" y="36" fill="#8a9c8a" font-size="9">shot 12 / 15</text>
      <text x="248" y="30" text-anchor="end" fill="#eeeeaa" font-size="17" font-weight="800">108</text>
    </g>
    <g transform="translate(0,112)"><rect x="0" y="0" width="264" height="48" rx="11" fill="#151b15" stroke="#2a3a2a"/>
      <text x="16" y="30" fill="#8a9c8a" font-size="16" font-weight="800">3</text>
      <circle cx="46" cy="24" r="12" fill="#5a3a2a"/><text x="46" y="28" text-anchor="middle" fill="#ffddcc" font-size="11" font-weight="800">MK</text>
      <text x="66" y="21" fill="#d4e2d4" font-weight="700">Mike K.</text><text x="66" y="36" fill="#8a9c8a" font-size="9">shot 11 / 15</text>
      <text x="248" y="30" text-anchor="end" fill="#c9d6c9" font-size="17" font-weight="800">96</text>
    </g>
    <g transform="translate(0,168)" opacity="0.6"><rect x="0" y="0" width="264" height="48" rx="11" fill="#131b13" stroke="#2a3a2a"/>
      <text x="16" y="30" fill="#8a9c8a" font-size="16" font-weight="800">4</text>
      <circle cx="46" cy="24" r="12" fill="#3a3a3a"/><text x="46" y="28" text-anchor="middle" fill="#ccc" font-size="11" font-weight="800">AL</text>
      <text x="66" y="21" fill="#c9d6c9" font-weight="700">Ana L.</text><text x="66" y="36" fill="#8a9c8a" font-size="9">shot 10 / 15</text>
      <text x="248" y="30" text-anchor="end" fill="#c9d6c9" font-size="17" font-weight="800">90</text>
    </g>
  </g>

  <!-- wind-only badge -->
  <g transform="translate(18,470)">
    <rect x="0" y="0" width="264" height="38" rx="10" fill="#151b15" stroke="#3a5a2a"/>
    <text x="14" y="24" fill="#c9d6c9" font-size="11">Mode: <tspan fill="#ffd464" font-weight="800">Wind only</tspan> — no elevation</text>
  </g>
  <!-- next shot button -->
  <g transform="translate(150,558)">
    <rect x="-92" y="-24" width="184" height="48" rx="24" fill="#3d8b3d" stroke="#4a9d4a"/>
    <text x="0" y="6" text-anchor="middle" fill="#eaffea" font-size="15" font-weight="800" letter-spacing="1">NEXT TARGET</text>
  </g>
</svg>
