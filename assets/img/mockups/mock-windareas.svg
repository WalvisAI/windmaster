<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 610" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="wa-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f150f"/><stop offset="1" stop-color="#0a100a"/></linearGradient>
    <linearGradient id="lane" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14210f"/><stop offset="1" stop-color="#1b2c14"/></linearGradient>
  </defs>
  <rect width="300" height="610" fill="url(#wa-bg)"/>
  <!-- header -->
  <text x="18" y="40" fill="#ffd464" font-size="15" font-weight="800" letter-spacing="1">WIND AREAS</text>
  <text x="18" y="58" fill="#8a9c8a" font-size="10.5">Wind drift across distance bands</text>

  <!-- top-down lane -->
  <g transform="translate(0,72)">
    <rect x="96" y="6" width="108" height="486" rx="10" fill="url(#lane)" stroke="#26361f"/>
    <!-- band separators + labels -->
    <g stroke="#3a4a30" stroke-dasharray="3 4">
      <line x1="96" y1="128" x2="204" y2="128"/><line x1="96" y1="250" x2="204" y2="250"/><line x1="96" y1="372" x2="204" y2="372"/>
    </g>
    <g font-size="9.5" fill="#647263" font-weight="700">
      <text x="30" y="70">45–50 m</text><text x="30" y="192">30–45 m</text><text x="30" y="314">15–30 m</text><text x="30" y="436">0–15 m</text>
    </g>
    <!-- per-band wind arrows -->
    <g stroke="#56a0c8" stroke-width="2" fill="#56a0c8">
      <g transform="translate(150,64)"><line x1="-30" y1="0" x2="24" y2="0"/><path d="M24,-5 L34,0 L24,5 Z"/></g>
      <g transform="translate(150,188)"><line x1="-20" y1="0" x2="14" y2="0"/><path d="M14,-4 L22,0 L14,4 Z"/></g>
      <g transform="translate(150,312)" opacity="0.5"><line x1="-10" y1="0" x2="6" y2="0"/><path d="M6,-3 L12,0 L6,3 Z"/></g>
      <g transform="translate(150,436)"><line x1="20" y1="0" x2="-14" y2="0"/><path d="M-14,-4 L-22,0 L-14,4 Z"/></g>
    </g>
    <!-- obstacle: wall (blocks band 3) -->
    <g transform="translate(96,300)"><rect x="-2" y="-6" width="10" height="48" rx="2" fill="#7a5420"/><text x="14" y="12" fill="#b8842e" font-size="9" font-weight="700">WALL</text></g>
    <!-- drift path of pellet (bottom shooter -> top target) -->
    <path d="M150,486 C150,430 150,380 156,360 C168,320 176,300 168,250 C160,206 138,180 150,128 C158,96 168,84 178,64"
          fill="none" stroke="#d95926" stroke-width="2.5" stroke-linecap="round"/>
    <!-- shooter + target -->
    <circle cx="150" cy="486" r="5" fill="#d4e2d4"/><text x="150" y="508" fill="#8a9c8a" font-size="9" text-anchor="middle">you</text>
    <g transform="translate(178,60)"><circle r="9" fill="#101a10" stroke="#3a6a2a" stroke-width="2"/><circle r="2.6" fill="#ffbb00"/></g>
  </g>
  <!-- result chip -->
  <g transform="translate(18,566)">
    <rect x="0" y="0" width="264" height="34" rx="9" fill="#151b15" stroke="#2a3a2a"/>
    <text x="12" y="22" fill="#8a9c8a" font-size="11">Drift at target</text>
    <text x="252" y="22" fill="#ffd464" font-size="14" font-weight="800" text-anchor="end">28 cm · 1.4 mil left</text>
  </g>
</svg>
