<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 610" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
  <rect width="300" height="610" fill="#0c120c"/>
  <text x="18" y="40" fill="#ffd464" font-size="15" font-weight="800" letter-spacing="1">TRAINING FT</text>
  <text x="18" y="58" fill="#8a9c8a" font-size="10.5">Log real shoots &amp; keep a history</text>

  <!-- stat tiles -->
  <g transform="translate(18,74)">
    <g><rect x="0" y="0" width="84" height="64" rx="11" fill="#151b15" stroke="#2a3a2a"/><text x="12" y="26" fill="#8a9c8a" font-size="9" font-weight="700">HIT RATE</text><text x="12" y="50" fill="#52c07a" font-size="24" font-weight="800">78%</text></g>
    <g transform="translate(94,0)"><rect x="0" y="0" width="84" height="64" rx="11" fill="#151b15" stroke="#2a3a2a"/><text x="12" y="26" fill="#8a9c8a" font-size="9" font-weight="700">HITS</text><text x="12" y="50" fill="#eeeeaa" font-size="24" font-weight="800">39</text></g>
    <g transform="translate(188,0)"><rect x="0" y="0" width="84" height="64" rx="11" fill="#151b15" stroke="#2a3a2a"/><text x="12" y="26" fill="#8a9c8a" font-size="9" font-weight="700">FAILS</text><text x="12" y="50" fill="#e06a6a" font-size="24" font-weight="800">11</text></g>
  </g>

  <!-- progress graph -->
  <g transform="translate(18,158)">
    <rect x="0" y="0" width="264" height="150" rx="11" fill="#0f150f" stroke="#2a3a2a"/>
    <text x="14" y="24" fill="#8a9c8a" font-size="10" font-weight="700">HIT RATE — LAST 8 SESSIONS</text>
    <g stroke="#26302a" stroke-width="1"><line x1="14" y1="118" x2="250" y2="118"/><line x1="14" y1="86" x2="250" y2="86"/><line x1="14" y1="54" x2="250" y2="54"/></g>
    <polyline points="24,104 56,96 88,100 120,80 152,72 184,74 216,60 248,50" fill="none" stroke="#3987e5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#3987e5"><circle cx="24" cy="104" r="3"/><circle cx="56" cy="96" r="3"/><circle cx="88" cy="100" r="3"/><circle cx="120" cy="80" r="3"/><circle cx="152" cy="72" r="3"/><circle cx="184" cy="74" r="3"/><circle cx="216" cy="60" r="3"/><circle cx="248" cy="50" r="3.5" fill="#ffd464"/></g>
  </g>

  <!-- weak points -->
  <text x="18" y="340" fill="#8a9c8a" font-size="10.5" font-weight="700" letter-spacing="1">WEAK POINTS (FAIL REASONS)</text>
  <g transform="translate(18,352)" font-size="11">
    <g><text x="0" y="16" fill="#c9d6c9">Wind compensation</text><rect x="150" y="6" width="132" height="12" rx="6" fill="#1a231a"/><rect x="150" y="6" width="92" height="12" rx="6" fill="#d95926"/></g>
    <g transform="translate(0,26)"><text x="0" y="16" fill="#c9d6c9">Parallax error</text><rect x="150" y="6" width="132" height="12" rx="6" fill="#1a231a"/><rect x="150" y="6" width="58" height="12" rx="6" fill="#e0b83e"/></g>
    <g transform="translate(0,52)"><text x="0" y="16" fill="#c9d6c9">Turret mistake</text><rect x="150" y="6" width="132" height="12" rx="6" fill="#1a231a"/><rect x="150" y="6" width="34" height="12" rx="6" fill="#56a056"/></g>
    <g transform="translate(0,78)"><text x="0" y="16" fill="#c9d6c9">Cant / hold error</text><rect x="150" y="6" width="132" height="12" rx="6" fill="#1a231a"/><rect x="150" y="6" width="22" height="12" rx="6" fill="#56a056"/></g>
  </g>

  <!-- conditions chip -->
  <g transform="translate(18,470)">
    <rect x="0" y="0" width="264" height="42" rx="10" fill="#151b15" stroke="#2a3a2a"/>
    <text x="14" y="19" fill="#647263" font-size="9" font-weight="700">CONDITIONS</text>
    <text x="14" y="34" fill="#c9d6c9" font-size="11">14 °C · wind moderate · 792 fps chrono</text>
  </g>
  <g transform="translate(150,558)">
    <rect x="-92" y="-24" width="184" height="48" rx="24" fill="#3d8b3d" stroke="#4a9d4a"/>
    <text x="0" y="6" text-anchor="middle" fill="#eaffea" font-size="15" font-weight="800" letter-spacing="1">NEW SESSION</text>
  </g>
</svg>
